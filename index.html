<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loji">
<title>Loji</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style id="splash-style">
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#FFFCEA;color:#000;transition:opacity .6s ease;cursor:pointer;padding:max(16px,env(safe-area-inset-left,0px))}
#splash.out{opacity:0;pointer-events:none}
#splash img{display:block;width:126px;height:96px;opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
#splash img.on{opacity:1;transform:none}
#splash p{font-family:"General Sans",system-ui,sans-serif;font-weight:500;font-size:24px;line-height:1.2;min-height:1.3em;margin:0;text-align:center}
#splash .caret{display:inline-block}
@media (prefers-reduced-motion:reduce){#splash img{transition:none}}
</style>
</head>
<body>
<div id="splash" aria-label="Loji">
  <img src="assets/logo.svg" alt="">
  <p id="splash-text"></p>
</div>

<style>
@font-face{font-family:"General Sans";src:url("assets/general-sans.ttf") format("truetype");font-weight:200 700;font-display:swap}
@font-face{font-family:"Brinko";src:url("assets/brinko.ttf") format("truetype");font-weight:400;font-display:swap}

:root{--cream:#FFFCEA;--white:#FFFFFF;--ink:#000000;--accent:#374426;--muted:rgba(0,0,0,.56);--line:rgba(0,0,0,.14);color-scheme:light}
html,body{margin:0;background:var(--cream);color:var(--ink)}
body{font-family:"General Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{max-width:440px;margin:0 auto;padding-top:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:120px}

.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:0}
.title{font-family:"Brinko","General Sans",system-ui,sans-serif;font-weight:400;font-size:38px;line-height:1.1;margin:8px 0 10px;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--muted);font-size:15px;min-height:1.5em}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:28px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}

.between{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:0 0 10px;font-weight:500}
.progress{height:6px;border-radius:99px;background:transparent;border:1px solid var(--ink);overflow:hidden;margin-bottom:6px}
.progress span{display:block;height:100%;width:var(--p);background:var(--accent);transition:width .4s ease}

/* lignes sans séparation */
.task{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;background:none;border:0;color:var(--ink);text-align:left;cursor:default}
button.task{cursor:pointer}
button.task:hover .name{text-decoration:underline;text-underline-offset:3px}
.task .name{flex:1;min-width:0}
.task .meta{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.task.done .name{color:var(--muted);text-decoration:line-through}
.task.later{opacity:.55}

/* carré à la main, avec une croix une fois la tâche faite */
.box{width:24px;height:24px;flex:none;display:block}
.box svg{width:24px;height:24px;display:block;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil);overflow:visible}
.task.done .box svg{stroke:var(--accent);stroke-width:2.4}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil);overflow:visible;flex:none}

.btn{display:block;width:100%;padding:14px 22px;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font-weight:500;font-size:16px;line-height:1.2;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.small{padding:11px 16px;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
.stack{display:grid;gap:10px;margin-top:20px}
.row2{grid-template-columns:1fr 2fr}

.field{width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;font-size:18px;border-radius:0}
.field:focus{outline:none;border-bottom-width:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none;margin:0}
.opt span{display:inline-block;padding:11px 16px;border-radius:999px;background:transparent;border:1px solid var(--ink);font-size:15px}
.opt:has(input:checked) span{background:var(--ink);color:var(--cream)}
.opt:has(input:focus-visible) span{outline:2px solid var(--ink);outline-offset:2px}
.nums{display:grid;gap:0}
.num{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.num input{width:72px;padding:6px;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:center}
.hint{min-height:1.4em;font-size:14px;margin:12px 0 0}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day{display:grid;justify-items:center;gap:2px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:500;cursor:pointer}
.day small{font-size:11px;font-weight:400;opacity:.6}
.day.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.day.sel small{opacity:.8}

.switch{width:44px;height:26px;border-radius:99px;border:1px solid var(--ink);background:transparent;position:relative;flex:none;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{background:var(--cream);transform:translateX(18px)}

.trow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:9px 0}
.trow .name{min-width:0}
.trow .meta{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.trow .psel{grid-column:1 / 2;justify-self:start;font-size:13px;padding:4px 8px 4px 0;border:0;border-bottom:1px solid var(--line);background:transparent}
.trow .freq{grid-column:1 / 2;font-size:13px;color:var(--muted)}
.trow .link{grid-column:2 / 4;justify-self:end}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .k{color:var(--muted)}
.row .v{font-weight:500;text-align:right}
.select{padding:8px 0;border:0;border-bottom:1px solid var(--ink);background:transparent}
.frow{display:flex;gap:12px;align-items:center;margin:12px 0}
.frow .num-in{width:70px;padding:8px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:center}
.addform{display:grid;gap:10px;margin-top:12px}

.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--cream) 75%,rgba(255,252,234,0))}
.tabs-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border:1px solid var(--line);border-radius:999px}
.tabs button{display:grid;justify-items:center;gap:2px;padding:7px 4px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-weight:500;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--cream)}
.tabs .ic{width:21px;height:21px;stroke-width:2}

.typing::after{content:"";display:inline-block;width:.07em;height:.85em;background:currentColor;margin-left:.06em;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.typing::after{animation:none}.progress span{transition:none}.switch::after{transition:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>
</svg>

<div class="app">
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" hidden>
  <div class="tabs-in">
    <button data-screen="today"><svg class="ic" viewBox="0 0 24 24"><path d="M3.8 11.6 L12.2 4.4 L20.4 11.2"/><path d="M6.2 10.4 V20 H18.2 V10.6"/><path d="M10.1 20 V14.6 H14.2 V20"/></svg><span>Aujourd’hui</span></button>
    <button data-screen="planning"><svg class="ic" viewBox="0 0 24 24"><path d="M4.2 5.4 H19.8 V20.4 H4.2 Z"/><path d="M4.4 9.9 H20"/><path d="M8.4 3.4 V7"/><path d="M15.8 3.2 V7.2"/></svg><span>Planning</span></button>
    <button data-screen="tasks"><svg class="ic" viewBox="0 0 24 24"><path d="M9.6 6.6 H20.3"/><path d="M9.6 12.1 H20.5"/><path d="M9.4 17.6 H19.9"/><path d="M3.8 6.4 l1.6 1.7 2.5-3"/><path d="M3.6 12 l1.8 1.6 2.3-2.7"/><path d="M4 17.6 l1.5 1.4 2.7-2.9"/></svg><span>Tâches</span></button>
    <button data-screen="profile"><svg class="ic" viewBox="0 0 24 24"><circle cx="12.1" cy="8.6" r="4.2"/><path d="M4.6 20.6 C5.9 16.8 8.6 15 12.1 15 C15.7 15 18.3 16.8 19.5 20.5"/></svg><span>Profil</span></button>
  </div>
</nav>

<script>
(function(){
const $ = s => document.querySelector(s);
const view = $("#view");
const tabs = $("#tabs");
const KEY = "loji.v3";
const ROOMS = ["Cuisine","Salle de bain","Toilettes","Chambre","Linge","Animaux","Général"];
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const PER = {quotidien:1, hebdo:7, deux_sem:14, mensuel:30, trimestriel:90};
const PERIODS = [[1,"Chaque jour"],[2,"Tous les 2 jours"],[3,"Tous les 3 jours"],[7,"Chaque semaine"],[14,"Toutes les 2 semaines"],[30,"Chaque mois"],[90,"Chaque trimestre"]];

// kind : "obl" obligatoire, non comptée · "add" additionnelle, non comptée · "ess" essentielle, prioritaire · "" normale
// slot : {p: période, d: [jours 0=lundi], w: semaine, m: mois} · repl : tâche remplacée le jour où celle-ci est faite
const CAT = [
{id:"T005",room:"Général",name:"Aérer les pièces",freq:"quotidien",min:3,cond:"all",kind:"obl"},
{id:"T004",room:"Chambre",name:"Faire les lits",freq:"quotidien",min:3,cond:"chambre",kind:"obl"},
{id:"T001",room:"Général",name:"Ranger les objets qui traînent",freq:"quotidien",min:5,cond:"all",kind:"obl"},
{id:"T012",room:"Cuisine",name:"Faire la vaisselle ou lancer le lave-vaisselle",freq:"quotidien",min:8,cond:"vaisselle",kind:"add"},
{id:"T007",room:"Cuisine",name:"Nettoyer le plan de travail",freq:"quotidien",min:3,cond:"cuisine",kind:""},
{id:"T009",room:"Cuisine",name:"Nettoyer l’évier",freq:"quotidien",min:2,cond:"cuisine",kind:""},
{id:"T008",room:"Cuisine",name:"Nettoyer la table après les repas",freq:"quotidien",min:2,cond:"cuisine",kind:""},
{id:"T022",room:"Toilettes",name:"Vérifier la propreté des toilettes",freq:"quotidien",min:1,cond:"toilettes",kind:""},
{id:"T018",room:"Animaux",name:"Nettoyer les gamelles",freq:"quotidien",min:2,cond:"animaux",kind:""},
{id:"T017",room:"Animaux",name:"Retirer les poils visibles",freq:"quotidien",min:3,cond:"animaux",kind:""},

{id:"T085",room:"Cuisine",name:"Nettoyer le four",freq:"hebdo",min:20,cond:"four",kind:"",slot:{p:7,d:[0]}},
{id:"T039",room:"Cuisine",name:"Nettoyer le micro-ondes",freq:"hebdo",min:5,cond:"micro_ondes",kind:"",slot:{p:7,d:[0]}},
{id:"T034",room:"Cuisine",name:"Nettoyer la plaque de cuisson",freq:"hebdo",min:5,cond:"cuisine",kind:"",slot:{p:7,d:[0,2,4]}},
{id:"T033",room:"Cuisine",name:"Nettoyer l’évier et la robinetterie",freq:"hebdo",min:5,cond:"cuisine",kind:"",slot:{p:7,d:[4]},repl:"T009"},
{id:"T038",room:"Cuisine",name:"Nettoyer l’extérieur du réfrigérateur",freq:"hebdo",min:3,cond:"cuisine",kind:"",slot:{p:7,d:[4]}},
{id:"T046",room:"Salle de bain",name:"Nettoyer douche ou baignoire",freq:"hebdo",min:10,cond:"sdb",kind:"ess",slot:{p:7,d:[1]}},
{id:"T044",room:"Salle de bain",name:"Nettoyer lavabo et vasque",freq:"hebdo",min:3,cond:"sdb",kind:"",slot:{p:7,d:[1,3,5]}},
{id:"T048",room:"Toilettes",name:"Nettoyer cuvette et surfaces extérieures",freq:"hebdo",min:8,cond:"toilettes",kind:"ess",slot:{p:7,d:[1]}},
{id:"T024",room:"Général",name:"Passer l’aspirateur",freq:"hebdo",min:15,cond:"all",kind:"ess",slot:{p:7,d:[2,5]}},
{id:"T025",room:"Général",name:"Laver les sols",freq:"hebdo",min:15,cond:"all",kind:"ess",slot:{p:7,d:[2]}},
{id:"T026",room:"Général",name:"Dépoussiérer meubles et surfaces",freq:"hebdo",min:10,cond:"all",kind:"",slot:{p:7,d:[3]}},
{id:"T054",room:"Chambre",name:"Changer les draps",freq:"hebdo",min:10,cond:"chambre",kind:"",slot:{p:7,d:[5]}},
{id:"T059",room:"Linge",name:"Lancer les lessives",freq:"hebdo",min:5,cond:"lave_linge",kind:"",slot:{p:7,d:[5]}},
{id:"T060",room:"Linge",name:"Étendre le linge ou lancer le sèche-linge",freq:"hebdo",min:5,cond:"lave_linge",kind:"",slot:{p:7,d:[5]}},
{id:"T030",room:"Général",name:"Vider les poubelles",freq:"hebdo",min:5,cond:"all",kind:"ess",slot:{p:7,d:[6]}},

{id:"T069",room:"Cuisine",name:"Nettoyer l’intérieur du réfrigérateur",freq:"deux_sem",min:15,cond:"cuisine",kind:"",slot:{p:14,d:[0],w:0}},
{id:"T072",room:"Général",name:"Dépoussiérer les plinthes",freq:"deux_sem",min:10,cond:"all",kind:"",slot:{p:14,d:[3],w:1}},

{id:"T086",room:"Cuisine",name:"Nettoyer le lave-vaisselle et son filtre",freq:"mensuel",min:10,cond:"lave_vaisselle",kind:"",slot:{p:30,d:[6],w:0}},
{id:"T088",room:"Linge",name:"Nettoyer le bac à lessive et les joints",freq:"mensuel",min:10,cond:"lave_linge",kind:"",slot:{p:30,d:[5],w:1}},
{id:"T110",room:"Général",name:"Nettoyer les rebords de fenêtres",freq:"mensuel",min:8,cond:"all",kind:"",slot:{p:30,d:[2],w:2}},

{id:"T117",room:"Général",name:"Nettoyer stores et volets intérieurs",freq:"trimestriel",min:20,cond:"all",kind:"",slot:{p:90,d:[5],w:0,m:0}},
{id:"T116",room:"Général",name:"Laver les rideaux selon leur matière",freq:"trimestriel",min:30,cond:"all",kind:"",slot:{p:90,d:[5],w:2,m:1}},
{id:"T124",room:"Cuisine",name:"Dégraisser la hotte et ses filtres",freq:"trimestriel",min:20,cond:"hotte",kind:"",slot:{p:90,d:[4],w:1,m:2}}
];

const STEPS = [
  {key:"prenom", type:"text", q:"Comment veux-tu qu’on t’appelle ?", ph:"Prénom ou pseudo"},
  {key:"objectif", type:"single", q:"Quel est ton objectif principal ?", opts:["Garder propre au quotidien","Rattraper un retard","Mieux répartir les tâches","Ne plus réfléchir à quoi faire"]},
  {key:"logement", type:"single", q:"Tu habites dans…", opts:["Appartement","Maison","Studio","Autre"]},
  {key:"surface", type:"single", q:"Quelle est la superficie ?", opts:["Moins de 25 m²","25–49 m²","50–74 m²","75–99 m²","100 m² ou plus","Je ne sais pas"]},
  {key:"pieces", type:"numbers", q:"Ton logement en détail", fields:[["chambres","Chambres"],["sdb","Salles de bain"],["toilettes","Toilettes"]]},
  {key:"enfants", type:"single", q:"As-tu des enfants à la maison ?", opts:["Non","Oui"]},
  {key:"animaux", type:"single", q:"As-tu des animaux ?", opts:["Aucun","Chat","Chien","Autre"]},
  {key:"eq", type:"multi", q:"Quels équipements as-tu ?", opts:[["lave_vaisselle","Lave-vaisselle"],["lave_linge","Lave-linge"],["four","Four"],["micro_ondes","Micro-ondes"],["hotte","Hotte"]]},
  {key:"temps", type:"single", q:"Combien de temps par jour ?", opts:[["5","5 min"],["10","10 min"],["15","15 min"],["20","20 min"],["30","30 min"],["45","45 min"],["60","60 min"]]},
  {key:"jours", type:"multi", q:"Quels jours es-tu disponible ?", opts:DAYS},
  {key:"etat", type:"single", q:"Comment décrirais-tu l’état actuel ?", opts:["Déjà propre","Quelques tâches en retard","Plusieurs tâches accumulées","Grand rattrapage"]}
];

let S = load();
let screen = "today";
let selDate = new Date();
let editing = false;
let obStep = 0;
let ob = blankOb();

function load(){
  try { return Object.assign({profile:null, done:{}, disabled:[], freq:{}, custom:[]}, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch(e){ return {profile:null, done:{}, disabled:[], freq:{}, custom:[]}; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function blankOb(){ return {prenom:"", objectif:null, logement:null, surface:null, chambres:1, sdb:1, toilettes:1, enfants:null, animaux:null, eq:[], temps:null, jours:[], etat:null}; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function wdIndex(d){ return (d.getDay() + 6) % 7; }
function dayNum(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function dkey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function fmtLong(d){ return cap(d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"})); }
function idNum(id){
  if (/^T\d+$/.test(id)) return parseInt(id.slice(1), 10);
  let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 100000;
  return h;
}
function row(k, v){ return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v == null ? "—" : v) + '</span></div>'; }
function periodLabel(n){ const f = PERIODS.find(p => p[0] === n); return f ? f[1] : "Tous les " + n + " jours"; }
function boxHTML(done){
  return '<span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/>'
       + (done ? '<path d="M7.5 7.5 L16.5 16.5 M16.5 7.5 L7.5 16.5"/>' : '') + '</svg></span>';
}

function condOk(c, p){
  switch(c){
    case "all": case "cuisine": case "vaisselle": return true;
    case "chambre": return p.chambres > 0;
    case "sdb": return p.sdb > 0;
    case "toilettes": return p.toilettes > 0;
    case "animaux": return !!p.animaux && p.animaux !== "Aucun";
    default: return (p.eq || []).indexOf(c) !== -1;
  }
}
function isFree(t){ return t.kind === "obl" || t.kind === "add"; }

// Tâches applicables au profil, avec la récurrence réellement utilisée (modifiable)
function eligible(p){
  const base = CAT.map(r => ({id:r.id, room:r.room, name:r.name, period:PER[r.freq], min:r.min, cond:r.cond, kind:r.kind || "", slot:r.slot || null, repl:r.repl || null, custom:false}));
  const cust = S.custom.map(c => ({id:c.id, room:c.room, name:c.name, period:c.period, min:c.min, cond:"all", kind:"", slot:null, repl:null, custom:true}));
  return base.concat(cust)
    .map(t => Object.assign(t, {period: S.freq[t.id] || t.period}))
    .filter(t => condOk(t.cond, p));
}
// Une tâche est due ce jour-là si son créneau correspond, sinon selon sa période
function isDue(t, d){
  const n = dayNum(d);
  if (t.period === 1) return true;
  if (t.slot && t.period === t.slot.p) {
    if (t.slot.d.indexOf(wdIndex(d)) === -1) return false;
    const dom = d.getDate();
    if (t.slot.p === 7) return true;
    if (t.slot.p === 14) return Math.floor(n / 7) % 2 === t.slot.w;
    if (t.slot.p === 30) return Math.floor((dom - 1) / 7) === t.slot.w;
    if (t.slot.p === 90) return Math.floor((dom - 1) / 7) === t.slot.w && d.getMonth() % 3 === t.slot.m;
  }
  return (n + idNum(t.id)) % t.period === 0;
}
function dueOn(d, p){
  const due = eligible(p).filter(t => S.disabled.indexOf(t.id) === -1 && isDue(t, d));
  const replaced = due.filter(t => t.repl).map(t => t.repl);
  return due.filter(t => replaced.indexOf(t.id) === -1);
}
function isDone(d, id){ return (S.done[dkey(d)] || []).indexOf(id) !== -1; }
function toggleDone(d, id){
  const k = dkey(d);
  const arr = S.done[k] || [];
  S.done[k] = arr.indexOf(id) !== -1 ? arr.filter(x => x !== id) : arr.concat([id]);
  save();
}

// Simule la semaine du jour T : une tâche non faite reste en attente et glisse au jour suivant
// jusqu'à être faite. Les tâches obligatoires restent du jour où elles tombent.
function weekPlan(T, p){
  const mon = new Date(T.getFullYear(), T.getMonth(), T.getDate());
  mon.setDate(mon.getDate() - wdIndex(mon));
  let pending = [];
  const days = {};
  for (let i = 0; i < 7; i++){
    const D = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    const due = dueOn(D, p);
    const free = due.filter(isFree);
    due.filter(t => !isFree(t)).forEach(t => { if (!pending.some(x => x.id === t.id)) pending.push(t); });
    pending.sort((a, b) => ((b.kind === "ess") - (a.kind === "ess")) || (ROOMS.indexOf(a.room) - ROOMS.indexOf(b.room)));
    const budget = p.jours.indexOf(DAYS[i]) !== -1 ? p.temps : 0;
    let total = 0;
    const assigned = [];
    pending.forEach(t => { if (total + t.min <= budget) { assigned.push(t); total += t.min; } });
    pending = pending.filter(t => !(assigned.indexOf(t) !== -1 && isDone(D, t.id)));
    days[dkey(D)] = {today: free.concat(assigned), total: total, budget: budget, carried: pending.filter(t => assigned.indexOf(t) === -1)};
  }
  return {days: days, leftover: pending};
}

function todayHTML(){
  const p = S.profile, d = new Date(), wp = weekPlan(d, p), info = wp.days[dkey(d)];
  const pl = info.today;
  const done = pl.filter(t => isDone(d, t.id));
  const remaining = pl.length - done.length;
  const left = pl.filter(t => !isDone(d, t.id) && !isFree(t)).reduce((s, t) => s + t.min, 0);
  const pct = pl.length ? Math.round(done.length / pl.length * 100) : 0;
  const greet = p.prenom ? "Bonjour " + p.prenom : "Bonjour";
  let sub;
  if (!pl.length) sub = info.budget ? "Rien à faire aujourd’hui. Profite-en." : "Jour libre. Rien au programme.";
  else if (remaining === 0) sub = "Tout est fait pour aujourd’hui. Bravo.";
  else sub = "Il reste " + remaining + " tâche" + (remaining > 1 ? "s" : "") + ", environ " + left + " min.";

  let h = '<p class="eyebrow">' + esc(fmtLong(d)) + '</p>'
        + '<h1 class="title" data-type="' + esc(greet) + '">' + esc(greet) + '</h1>'
        + '<p class="sub" data-type="' + esc(sub) + '">' + esc(sub) + '</p>'
        + '<div class="between"><strong>' + done.length + ' sur ' + pl.length + ' faites</strong>'
        + '<span class="muted small">' + info.total + ' min prévues · ' + info.budget + ' min dispo</span></div>'
        + '<div class="progress" style="--p:' + pct + '%"><span></span></div>';

  ROOMS.forEach(room => {
    const items = pl.filter(t => t.room === room);
    if (!items.length) return;
    h += '<p class="label">' + esc(room) + '</p>' + items.map(t => {
      const dn = isDone(d, t.id);
      return '<button class="task' + (dn ? ' done' : '') + '" data-action="toggle" data-id="' + t.id + '">'
           + boxHTML(dn)
           + '<span class="name">' + esc(t.name) + '</span>'
           + '<span class="meta">' + t.min + ' min</span></button>';
    }).join("");
  });

  const later = info.carried.filter(t => pl.indexOf(t) === -1);
  if (later.length) {
    h += '<p class="label">Reportées à demain</p>'
       + '<p class="muted small">Elles restent à faire jusqu’à la fin de la semaine.</p>'
       + later.map(t => '<div class="task later">' + boxHTML(false) + '<span class="name">' + esc(t.name) + '</span><span class="meta">' + t.min + ' min</span></div>').join("");
  }
  return h;
}

function planningHTML(){
  const p = S.profile;
  const wp = weekPlan(selDate, p);
  const weekDone = {};
  Object.keys(wp.days).forEach(k => {
    wp.days[k].today.forEach(t => { if (isDone(new Date(k), t.id)) weekDone[t.id] = true; });
  });
  const doneCount = Object.keys(weekDone).length;
  const left = wp.leftover.length;
  let days = "";
  const mon = new Date(selDate.getFullYear(), selDate.getMonth(), selDate.getDate());
  mon.setDate(mon.getDate() - wdIndex(mon));
  for (let i = 0; i < 7; i++){
    const x = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    const on = dkey(x) === dkey(selDate);
    const info = wp.days[dkey(x)];
    days += '<button class="day' + (on ? ' sel' : '') + '" data-action="day" data-date="' + dkey(x) + '">'
          + '<small>' + DAYS[i] + '</small>' + x.getDate() + '<small>' + info.total + ' min</small></button>';
  }
  const info = wp.days[dkey(selDate)];
  const list = info.today.length
    ? info.today.map(t => { const dn = isDone(selDate, t.id); return '<div class="task' + (dn ? ' done' : '') + '">' + boxHTML(dn) + '<span class="name">' + esc(t.name) + '</span><span class="meta">' + t.min + ' min</span></div>'; }).join("")
    : '<p class="muted">Rien de prévu ce jour-là.</p>';
  const summary = left
    ? left + ' tâche' + (left > 1 ? "s" : "") + ' ne rentre' + (left > 1 ? "nt" : "") + ' pas dans ton temps cette semaine. Allège la semaine ou augmente ton temps quotidien.'
    : 'Toute la semaine tient dans ton temps. ' + doneCount + ' tâche' + (doneCount > 1 ? "s" : "") + ' faite' + (doneCount > 1 ? "s" : "") + ' jusqu’ici.';
  return '<h1 class="title" data-type="Ta semaine">Ta semaine</h1>'
       + '<p class="sub">' + esc(summary) + '</p>'
       + '<div class="week">' + days + '</div>'
       + '<p class="label">' + esc(fmtLong(selDate)) + '</p>' + list;
}

function periodControl(t){
  if (t.slot && t.slot.d.length > 1 && t.slot.p === 7) {
    return '<span class="freq">' + t.slot.d.length + ' fois par semaine · ' + t.slot.d.map(i => DAYS[i]).join(", ") + '</span>';
  }
  const opts = PERIODS.slice();
  if (!opts.some(o => o[0] === t.period)) opts.push([t.period, periodLabel(t.period)]);
  return '<select class="psel" data-action="period" data-id="' + t.id + '" aria-label="Récurrence de ' + esc(t.name) + '">'
       + opts.map(o => '<option value="' + o[0] + '"' + (o[0] === t.period ? ' selected' : '') + '>' + o[1] + '</option>').join("")
       + '</select>';
}

function tasksHTML(){
  const p = S.profile, list = eligible(p);
  let h = '<h1 class="title" data-type="Tâches">Tâches</h1>'
        + '<p class="sub">Choisis la récurrence de chaque tâche, ou désactive celles qui ne te concernent pas.</p>';
  ROOMS.forEach(room => {
    const items = list.filter(t => t.room === room);
    if (!items.length) return;
    h += '<p class="label">' + esc(room) + '</p>' + items.map(t => {
      const on = S.disabled.indexOf(t.id) === -1;
      return '<div class="trow"><span class="name">' + esc(t.name) + '</span>'
           + '<span class="meta">' + t.min + ' min</span>'
           + '<button class="switch" data-action="disable" data-id="' + t.id + '" aria-checked="' + on + '" aria-label="Planifier : ' + esc(t.name) + '"></button>'
           + periodControl(t)
           + (t.custom ? '<button class="link" data-action="delete" data-id="' + t.id + '">Supprimer</button>' : '')
           + '</div>';
    }).join("");
  });
  h += '<p class="label">Ajouter une tâche</p>'
     + '<form id="addForm" class="addform" onsubmit="return false">'
     + '<input class="field" name="name" placeholder="Ex. passer la serpillière au salon" maxlength="60" autocomplete="off">'
     + '<div class="frow"><select name="room" class="select">' + ROOMS.map(r => '<option>' + esc(r) + '</option>').join("") + '</select>'
     + '<input class="num-in" type="number" name="min" min="1" max="240" value="10" inputmode="numeric"><span class="muted small">min</span></div>'
     + '<select name="period" class="select">' + PERIODS.map(o => '<option value="' + o[0] + '"' + (o[0] === 7 ? ' selected' : '') + '>' + o[1] + '</option>').join("") + '</select>'
     + '</form>'
     + '<p class="hint" id="addHint"></p>'
     + '<div class="stack"><button class="btn" data-action="add">Ajouter cette tâche</button></div>';
  return h;
}

function profileHTML(){
  const p = S.profile;
  return '<h1 class="title" data-type="Ton profil">Ton profil</h1>'
       + '<p class="sub">Tu peux changer le temps quotidien à tout moment.</p>'
       + row("Prénom", p.prenom || "—") + row("Logement", p.logement) + row("Superficie", p.surface)
       + row("Chambres", p.chambres) + row("Salles de bain", p.sdb) + row("Toilettes", p.toilettes)
       + row("Enfants", p.enfants) + row("Animaux", p.animaux) + row("Jours disponibles", p.jours.join(", "))
       + '<div class="row"><span class="k">Temps par jour</span><select id="temps" class="select">'
       + [5,10,15,20,30,45,60].map(m => '<option value="' + m + '"' + (m === p.temps ? ' selected' : '') + '>' + m + ' min</option>').join("")
       + '</select></div>'
       + '<div class="stack"><button class="btn ghost" data-action="restart">Refaire le questionnaire</button></div>';
}

function stepHTML(i){
  const total = STEPS.length;
  if (i === total) return recapHTML();
  const s = STEPS[i];
  let fields = "";
  if (s.type === "text") {
    fields = '<input class="field" name="' + s.key + '" placeholder="' + esc(s.ph) + '" value="' + esc(ob[s.key] || "") + '" autocomplete="off">';
  } else if (s.type === "numbers") {
    fields = '<div class="nums">' + s.fields.map(f => '<label class="num"><span>' + f[1] + '</span><input type="number" inputmode="numeric" min="0" max="6" name="' + f[0] + '" value="' + ob[f[0]] + '"></label>').join("") + '</div>';
  } else {
    const multi = s.type === "multi";
    fields = '<div class="opts">' + s.opts.map(o => {
      const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
      const on = multi ? ob[s.key].indexOf(v) !== -1 : ob[s.key] === v;
      return '<label class="opt"><input type="' + (multi ? "checkbox" : "radio") + '" name="' + s.key + '" value="' + esc(v) + '"' + (on ? ' checked' : '') + '><span>' + esc(l) + '</span></label>';
    }).join("") + '</div>';
  }
  const left = i > 0 ? '<button class="btn ghost small" data-action="back">Retour</button>'
             : (editing ? '<button class="btn ghost small" data-action="cancel">Annuler</button>' : '<span></span>');
  return '<p class="eyebrow">Étape ' + (i + 1) + ' sur ' + total + '</p>'
       + '<h1 class="title" data-type="' + esc(s.q) + '">' + esc(s.q) + '</h1>'
       + '<form id="obForm" onsubmit="return false">' + fields + '</form>'
       + '<p class="hint" id="hint"></p>'
       + '<div class="stack row2">' + left + '<button class="btn" data-action="next">Continuer</button></div>';
}

function profileFromOb(){
  return Object.assign({}, ob, {prenom: ob.prenom || "", temps: Number(ob.temps)});
}
function recapHTML(){
  const p = profileFromOb();
  const n = eligible(p).length;
  const t = (p.prenom ? p.prenom + ", ton" : "Ton") + " planning est prêt";
  const sub = n + " tâches adaptées à ton logement, environ " + p.temps + " min par jour sur les jours choisis.";
  return '<p class="eyebrow">Dernière étape</p>'
       + '<h1 class="title" data-type="' + esc(t) + '">' + esc(t) + '</h1>'
       + '<p class="sub" data-type="' + esc(sub) + '">' + esc(sub) + '</p>'
       + row("Logement", p.logement) + row("Temps par jour", p.temps + " min")
       + row("Jours", p.jours.join(", ")) + row("Objectif", p.objectif)
       + '<div class="stack"><button class="btn" data-action="create">Créer mon planning</button>'
       + '<button class="btn ghost" data-action="back">Modifier mes réponses</button></div>';
}

function readStep(i){
  const s = STEPS[i], fd = new FormData(document.getElementById("obForm")), hint = document.getElementById("hint");
  hint.textContent = "";
  if (s.type === "text") { ob[s.key] = String(fd.get(s.key) || "").trim(); return true; }
  if (s.type === "numbers") { s.fields.forEach(f => { ob[f[0]] = Math.min(6, Math.max(0, parseInt(fd.get(f[0]), 10) || 0)); }); return true; }
  if (s.type === "single") {
    const v = fd.get(s.key);
    if (!v) { hint.textContent = "Choisis une option pour continuer."; return false; }
    ob[s.key] = String(v); return true;
  }
  const vals = fd.getAll(s.key);
  if (s.key === "jours" && !vals.length) { hint.textContent = "Choisis au moins un jour."; return false; }
  ob[s.key] = vals; return true;
}

function readAdd(){
  const fd = new FormData(document.getElementById("addForm")), hint = document.getElementById("addHint");
  const name = String(fd.get("name") || "").trim();
  if (!name) { hint.textContent = "Donne un nom à la tâche."; return false; }
  const min = Math.min(240, Math.max(1, parseInt(fd.get("min"), 10) || 10));
  S.custom.push({id: "C" + Date.now(), room: String(fd.get("room")), name: name, min: min, period: Number(fd.get("period")) || 7});
  save();
  return true;
}

let typeToken = 0;
function typeAll(root){
  const token = ++typeToken;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let delay = 0;
  root.querySelectorAll("[data-type]").forEach(el => {
    const full = el.getAttribute("data-type") || "";
    if (reduce) { el.textContent = full; return; }
    el.textContent = "";
    el.classList.add("typing");
    const start = delay;
    delay += full.length * 26 + 200;
    setTimeout(() => {
      let i = 0;
      const step = () => {
        if (token !== typeToken) { el.textContent = full; el.classList.remove("typing"); return; }
        i++;
        el.textContent = full.slice(0, i);
        if (i < full.length) setTimeout(step, 26);
        else el.classList.remove("typing");
      };
      step();
    }, start);
  });
}

function render(anim){
  const onb = !S.profile || editing;
  tabs.hidden = onb;
  if (onb) view.innerHTML = stepHTML(obStep);
  else if (screen === "today") view.innerHTML = todayHTML();
  else if (screen === "planning") view.innerHTML = planningHTML();
  else if (screen === "tasks") view.innerHTML = tasksHTML();
  else view.innerHTML = profileHTML();
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.screen === screen));
  if (anim) typeAll(view);
}

view.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "toggle") { toggleDone(new Date(), el.dataset.id); render(false); }
  else if (a === "day") { const p = el.dataset.date.split("-").map(Number); selDate = new Date(p[0], p[1] - 1, p[2]); render(false); }
  else if (a === "disable") {
    const id = el.dataset.id;
    S.disabled = S.disabled.indexOf(id) !== -1 ? S.disabled.filter(x => x !== id) : S.disabled.concat([id]);
    save(); render(false);
  }
  else if (a === "add") { if (readAdd()) render(false); }
  else if (a === "delete") {
    const id = el.dataset.id;
    S.custom = S.custom.filter(c => c.id !== id);
    S.disabled = S.disabled.filter(x => x !== id);
    save(); render(false);
  }
  else if (a === "next") { if (readStep(obStep)) { obStep++; render(true); } }
  else if (a === "back") { obStep = Math.max(0, obStep - 1); render(true); }
  else if (a === "cancel") { editing = false; render(true); }
  else if (a === "create") { S.profile = profileFromOb(); save(); editing = false; obStep = 0; screen = "today"; render(true); }
  else if (a === "restart") {
    ob = Object.assign(blankOb(), S.profile, {temps: String(S.profile.temps)});
    obStep = 0; editing = true; render(true);
  }
});
view.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "temps") { S.profile.temps = Number(t.value); save(); render(false); }
  else if (t.matches && t.matches('select[data-action="period"]')) {
    S.freq[t.dataset.id] = Number(t.value); save(); render(false);
  }
});
tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { screen = b.dataset.screen; render(true); }));

render(true);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); });
}
</script>
<script>
(function(){
  var sp = document.getElementById("splash");
  var img = sp.querySelector("img");
  var txt = document.getElementById("splash-text");
  var phrase = "Le quotidien bien pensé.";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var done = false;
  function finish(){
    if (done) return; done = true;
    sp.classList.add("out");
    setTimeout(function(){ sp.parentNode && sp.parentNode.removeChild(sp); }, 650);
  }
  sp.addEventListener("click", finish);
  requestAnimationFrame(function(){ img.classList.add("on"); });
  if (reduce) { txt.textContent = phrase; setTimeout(finish, 1200); return; }
  var i = 0;
  function type(){
    i++;
    txt.textContent = phrase.slice(0, i);
    if (i < phrase.length) setTimeout(type, 60);
    else setTimeout(finish, 900);
  }
  setTimeout(type, 800);
})();
</script>
